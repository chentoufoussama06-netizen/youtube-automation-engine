# Run the channels for a day, in the cloud, with nobody watching.
#
# scripts/autopilot.js, per channel: one documentary short a day cut from a
# compilation, the compilation itself as a 9-14 minute video every couple of
# days, and a freshly planned + researched compilation whenever the shorts run
# out. Every render passes scripts/autopilot/check-video.js before upload.
#
# Runs just after YouTube's daily quota resets (midnight Pacific = 07:00 UTC).
#
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   ENV_FILE             the whole engine .env, verbatim
#   YT_CREDENTIALS       config/credentials.json, base64
#   YT_TOKENS            config/tokens.json, base64            (Football Files)
#   YT_TOKENS_AFTERCACHE config/tokens.aftercache.json, base64
#   YT_TOKENS_CLIPS      config/tokens.clips.json, base64      (Viral Vault Clip)
#   YT_TOKENS_FOOTBALL2  config/tokens.football2.json, base64  (second football channel)
#
# Compilation photographs live on the `refs` release (one tarball per set),
# because .jpg is outside git.

name: daily-shorts

on:
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
    inputs:
      lane:
        description: "Only this channel (blank = all)"
        default: ""
      dry_run:
        description: "Plan only: render and post nothing"
        type: boolean
        default: false
      # Post ONE story by name instead of the day's run (needs a lane). The
      # article is the exact English Wikipedia title the facts are checked against.
      article:
        description: "One story: Wikipedia article (blank = normal run)"
        default: ""
      moment:
        description: "One story: the episode, one sentence with its year"
        default: ""
      title:
        description: "One story: the video title"
        default: ""

concurrency:
  group: daily-shorts
  cancel-in-progress: false

permissions:
  contents: write
  issues: write        # the limit alert opens an issue, which GitHub emails to the owner

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      # Gemini's free tier is 20 requests a day and a compilation needs ~25;
      # Groq carries the run and the others remain as fallbacks.
      AI_TEXT_PROVIDER: groq
      RESEARCH_WIKI_LANG: en
      GH_TOKEN: ${{ github.token }}
      # Offline TTS fallback. When Edge's websocket refuses the runner's IP
      # (the "finish green, post nothing" failure noted below), shorts-factory
      # narrates with Piper from these instead, so the channels still post.
      PIPER_BIN: ${{ github.workspace }}/.piper/piper/piper
      PIPER_VOICES_DIR: ${{ github.workspace }}/data/piper-voices
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          ffmpeg -version | head -1

      # Piper binary + voice models (~250 MB). Cached so the download happens
      # once, not every day. Bump the key suffix to force a refetch.
      - name: Cache Piper
        id: piper-cache
        uses: actions/cache@v4
        with:
          path: |
            .piper
            data/piper-voices
          key: piper-v1-linux-x86_64

      - name: Install Piper (offline TTS fallback)
        if: steps.piper-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p .piper data/piper-voices
          echo "Downloading Piper binary..."
          curl -sL https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz \
            | tar -xz -C .piper
          echo "Downloading voice models..."
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/en"
          dl() { curl -sL -o "data/piper-voices/$2" "$1?download=true"; }
          dl "$base/en_US/ryan/high/en_US-ryan-high.onnx"        en_US-ryan-high.onnx
          dl "$base/en_US/ryan/high/en_US-ryan-high.onnx.json"   en_US-ryan-high.onnx.json
          dl "$base/en_GB/alan/medium/en_GB-alan-medium.onnx"      en_GB-alan-medium.onnx
          dl "$base/en_GB/alan/medium/en_GB-alan-medium.onnx.json" en_GB-alan-medium.onnx.json
          dl "$base/en_US/amy/medium/en_US-amy-medium.onnx"        en_US-amy-medium.onnx
          dl "$base/en_US/amy/medium/en_US-amy-medium.onnx.json"   en_US-amy-medium.onnx.json

      # Non-fatal self-check: prove the binary runs and a voice synthesises.
      # If it fails the run still proceeds on Edge; the fallback just won't fire.
      - name: Verify Piper
        run: |
          chmod +x "$PIPER_BIN" || true
          ls -la data/piper-voices
          if echo "Piper self check." | "$PIPER_BIN" --model data/piper-voices/en_US-ryan-high.onnx --output_file /tmp/piper-check.wav 2>/tmp/piper-err; then
            echo "piper ok: $(stat -c%s /tmp/piper-check.wav) bytes"
          else
            echo "WARN piper self-check failed:"; cat /tmp/piper-err || true
          fi

      - name: Credentials
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          YT_CREDENTIALS: ${{ secrets.YT_CREDENTIALS }}
          YT_TOKENS: ${{ secrets.YT_TOKENS }}
          YT_TOKENS_AFTERCACHE: ${{ secrets.YT_TOKENS_AFTERCACHE }}
          YT_TOKENS_CLIPS: ${{ secrets.YT_TOKENS_CLIPS }}
          YT_TOKENS_FOOTBALL2: ${{ secrets.YT_TOKENS_FOOTBALL2 }}
          # A fresh AI key goes in its own secret (Settings -> Secrets ->
          # Actions) and replaces the one inside ENV_FILE; blank = keep ENV_FILE's.
          NEW_GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NEW_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NEW_MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          printf '%s\n' "$ENV_FILE" > .env
          for name in GROQ_API_KEY GEMINI_API_KEY MISTRAL_API_KEY; do
            value="$(printenv "NEW_$name" || true)"
            if [ -n "$value" ]; then
              sed -i "/^$name=/d" .env
              printf '%s=%s\n' "$name" "$value" >> .env
              echo "using the $name secret"
            fi
          done
          mkdir -p config
          echo "$YT_CREDENTIALS" | base64 -d > config/credentials.json
          echo "$YT_TOKENS" | base64 -d > config/tokens.json
          echo "$YT_TOKENS_AFTERCACHE" | base64 -d > config/tokens.aftercache.json
          echo "$YT_TOKENS_CLIPS" | base64 -d > config/tokens.clips.json
          echo "$YT_TOKENS_FOOTBALL2" | base64 -d > config/tokens.football2.json

      - name: Make and post
        env:
          PIN_ARTICLE: ${{ github.event.inputs.article }}
          PIN_MOMENT: ${{ github.event.inputs.moment }}
          PIN_TITLE: ${{ github.event.inputs.title }}
        run: |
          set -o pipefail
          node scripts/autopilot.js \
            ${{ github.event.inputs.lane != '' && format('--lane "{0}"', github.event.inputs.lane) || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} 2>&1 | tee autopilot.log

      # What went up today, with links, on the run's own page in GitHub, so
      # nobody has to open a log or keep a machine watching.
      - name: Report
        if: always()
        run: |
          {
            echo "## Autopilot $(date -u +%F)"
            echo
            sed -n '/=== summary ===/,$p' autopilot.log | tail -n +2 | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"

      # When a free AI tier runs out AND that cost the channels a post, open
      # (or bump) an issue that @mentions the owner — GitHub emails it. Says
      # which provider ran dry and exactly where the replacement key goes.
      - name: Limit alert
        if: always()
        run: |
          [ -f autopilot.log ] || exit 0
          summary="$(sed -n '/=== summary ===/,$p' autopilot.log)"
          lost="$(printf '%s\n' "$summary" | grep -E 'no story short|no short|not posted|crashed|upload failed' || true)"
          hits=""
          grep -E '\[AITextService\].*Gemini.*(429|quota|RESOURCE_EXHAUSTED)' autopilot.log >/dev/null && hits="$hits gemini"
          grep -E '\[AITextService\].*Groq.*(429|rate.?limit|tokens per day|TPD|quota)' autopilot.log >/dev/null && hits="$hits groq"
          grep -E '\[AITextService\].*Mistral.*(429|quota)' autopilot.log >/dev/null && hits="$hits mistral"
          if [ -z "$hits" ] || [ -z "$lost" ]; then echo "no limit problem today"; exit 0; fi

          body="$(mktemp)"
          {
            echo "@${{ github.repository_owner }} the autopilot hit a free AI limit on $(date -u +%F) and lost posts because of it."
            echo
            echo "**Ran out:**$hits"
            echo
            echo "**What it could not post:**"
            printf '%s\n' "$lost" | sed 's/^/- /'
            echo
            echo "**Fix (2 minutes):** make a new free key and paste it as a repository secret:"
            echo "${{ github.server_url }}/${{ github.repository }}/settings/secrets/actions/new"
            for p in $hits; do
              case "$p" in
                groq)    echo "- Groq → https://console.groq.com/keys → secret name \`GROQ_API_KEY\`" ;;
                gemini)  echo "- Gemini → https://aistudio.google.com/apikey → secret name \`GEMINI_API_KEY\`" ;;
                mistral) echo "- Mistral → https://console.mistral.ai/api-keys → secret name \`MISTRAL_API_KEY\`" ;;
              esac
            done
            echo
            echo "If the secret already exists, open it and press **Update**. The next run picks it up by itself."
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$body"

          title="AI limit hit — make a new key"
          open="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' || true)"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body"
          fi

      # The daily check. A run can finish green while posting nothing (the
      # Edge TTS 403 did exactly that for ten days from 2026-10-12), so every
      # channel that got no new public video today is named in an issue that
      # @mentions the owner — GitHub emails it. A day where every channel posts
      # closes the issue again.
      - name: Daily check
        # Skipped for dry runs and single-channel test runs.
        if: always() && github.event.inputs.dry_run != 'true' && !github.event.inputs.lane
        run: |
          title="Channels did not post today"
          summary=""
          [ -f autopilot.log ] && summary="$(sed -n '/=== summary ===/,$p' autopilot.log | tail -n +2)"
          channels="$(node -e "console.log(require('./scripts/autopilot/lanes').LANES.map(l=>l.name).join('\n'))")"
          missing=""
          while IFS= read -r ch; do
            [ -n "$ch" ] || continue
            printf '%s\n' "$summary" | grep -F "$ch:" | grep -q ' public https' || missing="$missing$ch"$'\n'
          done <<< "$channels"
          open="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number' || true)"

          if [ -z "$missing" ]; then
            echo "every channel posted today"
            [ -n "$open" ] && gh issue close "$open" --comment "All channels posted on $(date -u +%F). Closing."
            exit 0
          fi

          body="$(mktemp)"
          {
            echo "@${{ github.repository_owner }} $(date -u +%F): these channels got **no new video** today:"
            echo
            printf '%s' "$missing" | sed 's/^/- **/; s/$/**/'
            echo
            echo "**What the run said:**"
            echo '```'
            if [ -n "$summary" ]; then printf '%s\n' "$summary"; else echo "(the run crashed before it reached the summary)"; fi
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$body"
          if [ -n "$open" ]; then gh issue comment "$open" --body-file "$body"; else gh issue create --title "$title" --body-file "$body"; fi

      - name: Save state
        if: always()
        run: |
          git config user.name "autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet || git commit -m "state: autopilot $(date -u +%F)"
          git pull --rebase --quiet || true
          git push
